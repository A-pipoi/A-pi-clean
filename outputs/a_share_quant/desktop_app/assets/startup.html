<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A-pi 量化工作台</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f5f6fb; color: #20283b; }
    main { display: flex; flex-direction: column; align-items: center; gap: 15px; padding: 32px; text-align: center; }
    img { width: 76px; height: 76px; border-radius: 20px; }
    h1 { margin: 2px 0 0; font-size: 22px; font-weight: 700; }
    p { margin: 0; color: #667189; font-size: 14px; line-height: 1.6; }
    .indicator { width: 30px; height: 30px; margin-top: 10px; border: 3px solid #dcd9fb; border-top-color: #6758de; border-radius: 50%; will-change: transform; animation: turn 1s linear infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .indicator { animation: none; border-color: #6758de; } }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <img src="a-pi-mark.svg" alt="A-pi">
    <h1>A-pi 量化工作台</h1>
    <p>正在连接本地服务，请稍候。<br>首次启动可能需要确认 Windows 管理员提示。</p>
    <div class="indicator" aria-hidden="true"></div>
  </main>
</body>
</html>
